timeout: 3

# wallpaper is a plain 24-bit BMP generated by scripts/genwallpaper.py
wallpaper: boot():/wallpaper.bmp

interface_branding: KelpOS Boot Manager

/KelpOS
    protocol: limine
    kernel_path: boot():/boot/kelpos.elf
    module_path: boot():/boot/disk.img

/KelpOS (Silent Boot)
    protocol: limine
    kernel_path: boot():/boot/kelpos.elf
    module_path: boot():/boot/silent.flag
    module_path: boot():/boot/disk.img
